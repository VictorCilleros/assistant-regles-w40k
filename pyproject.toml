[project]
name = "assistant-regles"
version = "0.1.0"
description = "Assistant conversationnel qui répond à des questions précises sur un corpus de règle"
readme = "README.md"
authors = [
    { name = "VictorCilleros", email = "victor.cilleros.pro@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.8.0",
    "docling>=2.130.0",
    "docling-core>=2.98.0",
    "ipywidgets>=8.1.9",
    "pandas>=3.0.6",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.0",
    "tqdm>=4.70.1",
    "transformers>=5.17.0",
]

[project.scripts]
ingest-regles = "assistant_regles.ingest.pipeline:main"
indexer-regles = "assistant_regles.rag.pipeline:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbstripout>=0.9.1",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "-m", "not modele and not integration",
]
markers = [
    "modele: nécessite le vrai modèle BGE-M3 (téléchargement ~2,3 Go, GPU conseillé)",
    "integration: nécessite Docker (base PostgreSQL éphémère via testcontainers)",
]
