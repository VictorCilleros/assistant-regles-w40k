# Configuration de la partie RAG : un seul fichier pour l'indexation et la recherche.
# La section `embeddings` est partagée : chunks et questions DOIVENT être encodés
# par le même modèle, sinon leurs vecteurs ne sont pas comparables.

embeddings:
  modele: BAAI/bge-m3
  revision: 5617a9f61b028005a4858fdac845db406aefb181   # commit Hugging Face épinglé : vecteurs reproductibles
  dimension: 1024      # vérifiée au chargement ; doit correspondre à vector(1024) dans chunks_w40k
  device: auto         # auto | cpu | cuda (auto : GPU si disponible)
  fp16: true           # ignoré sur CPU ; écart mesuré fp16/fp32 : cosinus min 0,9997
  batch_size: 32       # 207 chunks en 0,6 s, pic VRAM 2,7 Go (RTX 5070 Ti)

recherche:
  k: 5                 # nombre de chunks renvoyés (valeur de départ de la spec, à ajuster via l'éval)

generation:
  modele: claude-sonnet-5
  max_tokens: 4096     # borne toute la sortie, réflexion comprise ; réponses observées ~1 500 tokens
  effort: medium       # low | medium | high | xhigh | max ; medium apporte les précisions utiles (notebook 06)
  reflexion: true      # true : réflexion adaptative (défaut du modèle) ; false : désactivée
  granularite: paragraphe   # chunk | paragraphe ; paragraphe : citations ciblées sur les cas particuliers
  prompt_systeme: systeme_vf.md    # fichier dans src/assistant_regles/rag/prompts/
  phrase_abstention: "Je ne trouve pas la réponse dans les extraits du livre de règles fournis."

agent:
  actif: true          # mode par défaut (interface et repondre-regles) ; désactivable à chaque question
  modele: claude-sonnet-5
  effort: high         # low | medium | high | xhigh | max, ou null pour ne pas envoyer le paramètre
  max_tokens: 16000    # par tour, réflexion comprise
  max_tours: 6         # appels au modèle pour la recherche (le dernier sert à conclure)
  max_passages: 8      # taille maximale de la sélection transmise au générateur
  min_passages: 5      # sélection complétée jusqu'à ce minimum avec les passages vus (0 = pas de complément)
  k: 5                 # passages par recherche (amorce et outil rechercher_regles)
  amorce: true         # première recherche faite par le code avec la question brute
  prompt: agent_vf.md  # fichier dans src/assistant_regles/rag/prompts/
  amorce_suivi : concatenation # questions de suite : concatenation (question précédente + courante) | aucune
  historique_tours : 4 #  tours précédents transmis à l'agent et au générateur (0 = questions indépendantes)
  historique_max_caracteres : 2000 # longueur maximale d'une réponse précédente transmise
