# Structure du livre de règles de base (d'après le sommaire).
# - Les pages sont les numéros de page Docling (identiques aux pages imprimées pour ce livre).
# - Les numéros de section sont des chaînes sur deux chiffres ENTRE GUILLEMETS
#   (sans guillemets, YAML lirait 01 comme l'entier 1 et la validation échouerait).
# - num: null pour les parties non numérotées (Appendices, Index).
# - Les titres doivent suivre l'orthographe du livre pour être reconnus s'ils sont détectés.

